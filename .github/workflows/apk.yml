# Construit deux APK Android (Capacitor) et les publie dans la release « apk » :
#   t900d-<version>.apk    dernière version (nom lu dans version.json, ex. v2)
#   t900d-<previous>.apk   version de repli (ex. v1), construite depuis le commit noté dans le fichier stable-ref
# Téléchargement : …/releases/latest/download/t900d-v2.apk
# Les deux portent le même versionCode (numéro de build) : on peut passer de l'une à l'autre sans désinstaller.
name: APK Android
on:
  push:
    branches: [main, claude/domyos-t900d-app-397ysr]
    paths-ignore: ['docs/**', 'README.md'] # la notice ne change pas l'APK
  workflow_dispatch:
permissions:
  contents: write
# Un seul build à la fois : deux builds simultanés se disputent la même release.
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - id: ver
        run: echo "v=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run sync
      - name: Gradle
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionLabel=${{ steps.ver.outputs.v }} --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk t900d-${{ steps.ver.outputs.v }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: T900D ${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          body: "Le numéro le plus élevé est la dernière version, l'autre est la version précédente, pour revenir en arrière. Ouvre le fichier sur le téléphone pour l'installer par-dessus l'appli : les données sont conservées."
          files: t900d-${{ steps.ver.outputs.v }}.apk
          make_latest: true

  precedente:
    needs: apk # même release : on évite deux mises à jour simultanées
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          echo "sha=$(cat stable-ref)" >> "$GITHUB_OUTPUT"
          echo "v=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
          echo "p=$(node -p "require('./version.json').previous")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { ref: "${{ steps.ref.outputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync
      - name: Gradle
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk t900d-${{ steps.ref.outputs.p }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          files: t900d-${{ steps.ref.outputs.p }}.apk
      - name: Ne garder que ces deux fichiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view apk -R ${{ github.repository }} --json assets -q '.assets[].name'); do
            case "$a" in
              t900d-${{ steps.ref.outputs.v }}.apk|t900d-${{ steps.ref.outputs.p }}.apk) ;;
              *) gh release delete-asset apk "$a" -R ${{ github.repository }} -y ;;
            esac
          done

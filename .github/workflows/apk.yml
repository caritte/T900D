# Construit les APK Android (Capacitor) et les publie dans la release « apk » :
#   t900d-<version>.apk   dernière version (nom lu dans version.json, ex. v3)
#   t900d-<nom>.apk       versions précédentes listées dans version.json, chacune reconstruite depuis son commit
# Toutes portent le même versionCode (numéro de build) : on passe de l'une à l'autre sans désinstaller.
# Téléchargement : …/releases/latest/download/t900d-v3.apk
name: APK Android
on:
  push:
    branches: [main, claude/domyos-t900d-app-397ysr]
    paths-ignore: ['docs/**', 'README.md'] # la notice ne change pas l'APK
  workflow_dispatch:
permissions:
  contents: write
# Un seul build à la fois : ils publient dans la même release.
concurrency:
  group: apk
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  R: ${{ github.repository }}
jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.ver.outputs.v }}
      prev: ${{ steps.ver.outputs.prev }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - id: ver
        run: |
          echo "v=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
          echo "prev=$(node -p "JSON.stringify(require('./version.json').previous)")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run sync
      - name: Gradle
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionLabel=${{ steps.ver.outputs.v }} --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk t900d-${{ steps.ver.outputs.v }}.apk
      # gh plutôt qu'une action tierce : l'envoi du fichier ne dépend pas de la mise à jour du titre,
      # que GitHub refuse parfois au jeton du workflow (« Resource not accessible by integration »).
      - name: Publie
        env:
          V: ${{ steps.ver.outputs.v }}
        run: |
          NOTES="Le numéro le plus élevé est la dernière version ; les autres sont les versions précédentes, pour revenir en arrière. Ouvre le fichier sur le téléphone pour l'installer par-dessus l'appli : les données sont conservées."
          gh release view apk -R "$R" >/dev/null 2>&1 || gh release create apk -R "$R" --title "T900D" --notes "$NOTES" --target "${{ github.sha }}"
          gh release upload apk "t900d-$V.apk" -R "$R" --clobber
          gh release edit apk -R "$R" --title "T900D $V (build ${{ github.run_number }})" --notes "$NOTES" --latest || echo "::warning::Titre de la release non mis à jour"

  precedentes:
    needs: apk
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.apk.outputs.prev) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ matrix.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync
      - name: Gradle
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionLabel=${{ matrix.name }} --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk t900d-${{ matrix.name }}.apk
      - name: Publie
        run: gh release upload apk "t900d-${{ matrix.name }}.apk" -R "$R" --clobber

  menage:
    needs: [apk, precedentes]
    runs-on: ubuntu-latest
    steps:
      - name: Ne garder que les versions listées
        env:
          V: ${{ needs.apk.outputs.v }}
          PREV: ${{ needs.apk.outputs.prev }}
        run: |
          KEEP="t900d-$V.apk $(echo "$PREV" | jq -r '.[].name | "t900d-\(.).apk"' | tr '\n' ' ')"
          for a in $(gh release view apk -R "$R" --json assets -q '.assets[].name'); do
            case " $KEEP " in *" $a "*) ;; *) gh release delete-asset apk "$a" -R "$R" -y ;; esac
          done
